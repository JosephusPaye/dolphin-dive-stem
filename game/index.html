<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Dolphin Dive STEM</title>
	<!-- <link rel="stylesheet" type="text/css" href="assets/css/vendor.css"> -->
	<link rel="stylesheet" type="text/css" href="assets/css/game.css">
</head>
<body>
	<!-- Overall game area wrapper -->
	<div class="game-area">
		<!-- Game canvas -->
		<div id="game"></div>
		
		<!-- Score indicators -->
		<div id="hud" class="hidden">
			<ul class="hud">
				<li>Score: <span id="currentScore">0</span></li>
				<li>Coins: <span id="currentCoinCount">0</span></li>
			</ul>
		</div>

		<!-- Main Menu -->
		<div id="mainMenu" class="menu hidden">
			<h1 class="title">Dolphin Dive</h1>
			<ul class="menu-buttons">
				<li><a id="beginButton">New Game</a></li>
				<li><a id="highScoresButton">High Scores</a></li>
				<li><a id="aboutButton">About</a></li>
			</ul>
		</div>

		<!-- Pause Menu -->
		<div id="pauseMenu" class="menu hidden">
			<h1 class="title">Paused</h1>
			<ul class="menu-buttons">
				<li><a id="resumeButton">Resume</a></li>
				<li><a id="restartButton">Restart</a></li>
				<li><a id="mainMenuButton">Quit to Main Menu</a></li>
			</ul>
		</div>

		<!-- Score Menu -->
		<div id="scoreMenu" class="menu hidden">
			<h1 class="title">Scores</h1>
			<ul class="menu-buttons">
				<span id="highscores-menu">
					<li><a>1020</a></li>
					<li><a>100</a></li>
					<li><a>73</a></li>
				</span>
				<li><a id="scoreReturnButton">Return</a></li>
			</ul>
		</div>

		<!-- About Menu -->
		<div id="aboutMenu" class="menu hidden">
			<h1 class="title">Dolphin Dive v<span id="versionTag"></span></h1>
			<p class="aboutText">We're all great, better than u, the end.</p>
			<br>
			<ul class="menu-buttons">
				<li><a id="aboutReturnButton">Okie dokie :)</a></li>
			</ul>
		</div>

		<!-- Top right pause button -->
		<div id="pauseButton" class="pauseButton hidden"><span class="icon-pause"></span></div>
	</div>

	<!-- Scripts -->
	<script src="assets/js/vendor.js"></script>
	<script src="assets/js/game.js"></script>
</body>
</html>
